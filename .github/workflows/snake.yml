name: Generate snake animation

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG variants
        uses: Platane/snk@v3
        with:
          github_user_name: lordware
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23e6ad59&color_dots=%23171d1f,%2355482e,%23886b3e,%23b08a4d,%23e6ad59
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e6ad59&color_dots=%23171d1f,%2355482e,%23886b3e,%23b08a4d,%23e6ad59

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

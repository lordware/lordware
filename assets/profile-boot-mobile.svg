<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
<title id="title">Embedded target POST simulation</title><desc id="desc">Fixed simulated startup diagnostics for an ATmega2560 target. Hardware statuses are demonstration fixtures, not measurements. The descriptor length and CRC32 are computed from the exact fixed byte buffer in the memory inspector.</desc>

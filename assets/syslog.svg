<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="lordware syslog tail of GitHub events">
  <defs>
    <style>
      .s-bg    { fill: #1A1814; }
      .s-subbg { fill: #221E18; }
      .s-border{ fill: none; stroke: #3A352C; stroke-width: 1; }
      .s-head  { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #FFB83D; font-weight: 700; }
      .s-headd { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #A89968; }
      .s-ts    { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #A89968; }
      .s-host  { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #4FC3FF; }
      .s-fac   { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #FFB83D; font-weight: 700; }
      .s-msg   { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; }
      .s-foot  { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #A89968; }
    </style>
    <clipPath id="s-clip">
      <rect x="0" y="24" width="960" height="196"/>
    </clipPath>
  </defs>
  <metadata id="syslog-cache">[{"ts":"2026-08-21T12:06:07.893756+00:00","facility":"init","color":"#A89968","msg":"no public events visible right now \u2014 try again later"}]</metadata>

  <rect class="s-bg" width="960" height="240"/>
  <rect class="s-border" x="0.5" y="0.5" width="959" height="239"/>

  <rect class="s-subbg" x="0" y="0" width="960" height="24"/>
  <line x1="0" y1="24" x2="960" y2="24" stroke="#3A352C" stroke-width="1"/>
  <text class="s-head"  x="12"  y="16">$ tail -F /var/log/lordware/github.log</text>
  <text class="s-headd" x="720" y="16">facility=user · 1 entries · live</text>

  <g clip-path="url(#s-clip)">
    <g transform="translate(0 24)">
      <animateTransform attributeName="transform" type="translate"
        from="0 24" to="0 11"
        dur="20s" repeatCount="indefinite"/>
      <g>
      <text x="12" y="13" class="s-ts">Aug 21 12:06:07</text>
      <text x="120" y="13" class="s-host">lordware-pi</text>
      <text x="208" y="13" class="s-fac">init:</text>
      <text x="262" y="13" fill="#A89968" class="s-msg">no public events visible right now — try again later</text>
      </g>
      <g transform="translate(0 13)">
      <text x="12" y="13" class="s-ts">Aug 21 12:06:07</text>
      <text x="120" y="13" class="s-host">lordware-pi</text>
      <text x="208" y="13" class="s-fac">init:</text>
      <text x="262" y="13" fill="#A89968" class="s-msg">no public events visible right now — try again later</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="220" x2="960" y2="220" stroke="#3A352C" stroke-width="1"/>
  <rect class="s-subbg" x="0" y="220" width="960" height="20"/>
  <circle cx="14" cy="230" r="3" fill="#FF5C3A">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text class="s-foot" x="24" y="234">rsyslog · /dev/github · lordware · regen */6h</text>
  <text class="s-foot" x="900" y="234">^C</text>
</svg>
